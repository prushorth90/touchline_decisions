[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "touchline-decisions-backend"
version = "0.1.0"
description = "FastAPI backend for Touchline Decisions"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.40,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "python-json-logger>=3.3,<4",
    "redis>=6.2,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs[s3]>=1.40,<2",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
